# 消融A：关闭 mosaic 增强（唯一变量），用于过拟合对照
name: ablation_no_mosaic
model: weights/yolov8n.pt
data: data/yolo/data.yaml
epochs: 50
imgsz: 640
batch: 8
workers: 8
patience: 10
seed: 42
optimizer: auto
lr0: 0.01
lrf: 0.01
cos_lr: true
warmup_epochs: 3
weight_decay: 0.0005
mosaic: 0.0
mixup: 0.0
close_mosaic: 0
amp: true
plots: true
